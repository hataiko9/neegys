
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nigger</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  height: 100vh;
  background: #080808;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
}
.tv {
  width: 90%;
  max-width: 1000px;
  height: 65vh;
  background: #111;
  border: 15px solid #292929;
  border-radius: 35px;
  box-shadow: 0 0 50px #333, inset 0 0 30px black;
  position: relative;
  overflow: hidden;
}
.screen {
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    transparent 0px,
    rgba(255,255,255,.08) 2px,
    transparent 4px
  ), #050505;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  animation: flicker .12s infinite;
}
h1 {
  color: #fff;
  font-size: clamp(35px, 8vw, 100px);
  font-weight: 1000;
  text-shadow: 0 0 10px red, 0 0 30px red;
  animation: glitch .3s infinite;
  padding: 20px;
}
.noise {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}
@keyframes flicker {
  0%,100% { opacity: 1; }
  50% { opacity: .85; }
}
@keyframes glitch {
  0% { transform: translate(0); }
  25% { transform: translate(3px,-2px); }
  50% { transform: translate(-3px,2px); }
  75% { transform: translate(2px,1px); }
}
</style>
</head>
<body>
  <div class="tv">
    <div class="screen">
      <h1>нихат<br>полный<br>лоох</h1>
    </div>
    <div class="noise"></div>
  </div>
</body>
</html>
