
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween TV 🎃</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle, #241007, #080808 75%);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* Телевизор */
.tv {
  width: 90%;
  max-width: 1000px;
  height: 65vh;
  min-height: 350px;
  background: #111;
  border: 15px solid #292929;
  border-radius: 35px;
  box-shadow: 0 0 50px #ff5100,
              inset 0 0 30px black;
  position: relative;
  overflow: hidden;
  z-index: 2;
}

.screen {
  width: 100%;
  height: 100%;
  background:
    repeating-linear-gradient(
      transparent 0px,
      rgba(255,255,255,.08) 2px,
      transparent 4px
    ), #050505;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  animation: flicker .12s infinite;
}

h1 {
  color: white;
  font-size: clamp(35px, 8vw, 100px);
  font-weight: 1000;
  text-shadow: 0 0 10px red, 0 0 30px red;
  animation: glitch .3s infinite;
  padding: 20px;
  z-index: 3;
}

.noise {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  z-index: 4;
  pointer-events: none;
}

/* Летучие мыши */
.bat {
  position: absolute;
  font-size: 35px;
  animation: fly linear infinite;
  z-index: 5;
  pointer-events: none;
}

@keyframes fly {
  0% {
    transform: translate(-100px, 0) rotate(-15deg);
  }
  50% {
    transform: translate(50vw, -100px) rotate(15deg);
  }
  100% {
    transform: translate(110vw, 50px) rotate(-15deg);
  }
}

/* Тыквы */
.pumpkin {
  position: absolute;
  bottom: 2%;
  font-size: clamp(35px, 6vw, 65px);
  filter: drop-shadow(0 0 15px orange);
  animation: pumpkinGlow 2s infinite alternate;
  z-index: 6;
}

.p1 { left: 3%; }
.p2 { right: 3%; }

@keyframes pumpkinGlow {
  from { filter: drop-shadow(0 0 5px orange); }
  to { filter: drop-shadow(0 0 25px red); }
}

/* Свечи */
.candle {
  position: absolute;
  bottom: 4%;
  font-size: 35px;
  animation: candleFlicker .5s infinite alternate;
  z-index: 6;
}

.c1 { left: 18%; }
.c2 { right: 18%; }

@keyframes candleFlicker {
  from {
    opacity: .7;
    transform: rotate(-3deg);
  }
  to {
    opacity: 1;
    transform: rotate(3deg);
    filter: drop-shadow(0 0 15px orange);
  }
}

@keyframes flicker {
  0%,100% { opacity: 1; }
  50% { opacity: .85; }
}

@keyframes glitch {
  0% { transform: translate(0); }
  25% { transform: translate(3px,-2px); }
  50% { transform: translate(-3px,2px); }
  75% { transform: translate(2px,1px); }
}

/* Декоративная луна */
.moon {
  position: absolute;
  top: 5%;
  right: 8%;
  font-size: 65px;
  filter: drop-shadow(0 0 25px orange);
}

/* Надпись */
.subtitle {
  position: absolute;
  bottom: 12px;
  width: 100%;
  color: #ff7518;
  text-align: center;
  font-size: 12px;
  letter-spacing: 5px;
  z-index: 7;
}

</style>
</head>

<body>

<div class="moon">🌕</div>

<!-- Летучие мыши -->
<div class="bat" style="top:10%; animation-duration:9s;">🦇</div>
<div class="bat" style="top:25%; animation-duration:12s; animation-delay:2s;">🦇</div>
<div class="bat" style="top:70%; animation-duration:10s; animation-delay:4s;">🦇</div>
<div class="bat" style="top:45%; animation-duration:14s; animation-delay:1s;">🦇</div>

<div class="tv">

  <div class="screen">
    <h1>
      нихат<br>
      полный<br>
      лоох
    </h1>
  </div>

  <div class="noise"></div>

</div>

<!-- Тыквы -->
<div class="pumpkin p1">🎃</div>
<div class="pumpkin p2">🎃</div>

<!-- Свечи -->
<div class="candle c1">🕯️</div>
<div class="candle c2">🕯️</div>

<div class="subtitle">
  HAPPY HALLOWEEN • 31 OCTOBER
</div>

</body>
</html>
